name: Build GUNTHER Android APK

on:
  push:
    branches: ["main", "arena/01a0ac66-guy", "master"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Generate keystores (debug + release)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA \
            -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          [ -f android/app/release.keystore ] || keytool -genkey -v \
            -keystore android/app/release.keystore -storepass gunther-release-2026 \
            -alias gunther -keypass gunther-release-2026 -keyalg RSA \
            -keysize 2048 -validity 10000 -dname "CN=Gunther,O=Gunther,C=US"

      - name: Install dependencies
        run: npm ci

      - name: Test the console (engine + smoke)
        run: npm test

      - name: Pack www for the shell
        run: node tools/pack-www.mjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gunther-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gunther-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Publish APK as a Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gunther-apk-${{ github.run_number }}
          name: "Gunther — Galaxy S25 APK (run ${{ github.run_number }})"
          body: |
            Gunther — Autonomous Building Console, packaged for Android.

            **Install (phone only, no computer needed):**
            1. Download `gunther-debug-apk.zip` below (or from the Artifacts list on the run page) and unzip it
            2. Tap the `.apk` → allow "install unknown apps" for your browser when asked
            3. Launch **Gunther**, open Service, and add your API keys

            Commit: ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: "true"
          fail_on_missing_files: false
